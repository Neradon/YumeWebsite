  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

nt(\"button\");\n    card.className = `card ${tiltCls}`;\n    card.innerHTML = `\n      <div class=\"c-photo\">\n        <span class=\"ph-label\">// ${p.handle.split(\" \")[0]}.jpg<\u002Fspan>\n        <span class=\"status-dot ${p.status === \"on\" ? \"\" : \"off\"}\">${p.status === \"on\" ? \"on shift\" : \"off today\"}<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"c-name\">${p.name}<\u002Fdiv>\n      <div class=\"c-handle\">${p.handle} · <span style=\"color:var(--plum-soft); font-family:var(--font-body); font-size:11px; text-transform:uppercase; letter-spacing:.1em;\">${p._role.slice(0,-1)}<\u002Fspan><\u002Fdiv>\n      <div class=\"c-tags\">\n        <span class=\"c-tag specialty\">${p.spec}<\u002Fspan>\n        ${p.tags.slice(0,2).map(t => `<span class=\"c-tag\">${t}<\u002Fspan>`).join(\"\")}\n      <\u002Fdiv>\n      <div class=\"c-quote\">\"${p.quote}\"<\u002Fdiv>\n    `;\n    card.addEventListener(\"click\", () => openModal(p._role, p));\n    roster.appendChild(card);\n  });\n}\nrenderRoster(\"all\");\n\n/* =========== TABS =========== */\ndocument.querySelectorAll(\"#roster-tabs .tab\").forEach(t => {\n  t.addEventListener(\"click\", () => {\n    document.querySelectorAll(\"#roster-tabs .tab\").forEach(b => b.classList.remove(\"active\"));\n    t.classList.add(\"active\");\n    renderRoster(t.dataset.roster);\n  });\n});\n\n/* =========== MODAL =========== */\nconst modal = document.getElementById(\"modal\");\nfunction openModal(key, p) {\n  document.getElementById(\"m-role\").textContent = ROLE_LABEL[key];\n  document.getElementById(\"m-name\").textContent = p.name;\n  document.getElementById(\"m-handle\").textContent = p.handle;\n  document.getElementById(\"m-ph-label\").textContent = `// ${p.handle.split(\" \")[0]}_full.jpg`;\n  document.getElementById(\"m-pronouns\").textContent = p.pronouns;\n  document.getElementById(\"m-bio\").textContent = p.bio;\n  document.getElementById(\"m-drink\").textContent = p.drink;\n  document.getElementById(\"m-bday\").textContent = p.bday;\n  document.getElementById(\"m-shifts\").textContent = p.shifts;\n  document.getElementById(\"m-debut\").textContent = p.debut;\n  const specs = document.getElementById(\"m-specs\");\n  specs.innerHTML = [p.spec, ...p.tags].map(t => `<span class=\"c-tag\">${t}<\u002Fspan>`).join(\"\");\n  document.getElementById(\"m-quote\").textContent = `\"${p.quote}\"`;\n  modal.classList.add(\"open\");\n}\nfunction closeModal() { modal.classList.remove(\"open\"); }\ndocument.getElementById(\"modal-close\").addEventListener(\"click\", closeModal);\nmodal.addEventListener(\"click\", (e) => { if (e.target === modal) closeModal(); });\ndocument.addEventListener(\"keydown\", (e) => { if (e.key === \"Escape\") closeModal(); });\n\n/* =========== SMOOTH SCROLL =========== */\ndocument.querySelectorAll(\"[data-scroll]\").forEach(b => {\n  b.addEventListener(\"click\", () => {\n    const t = document.querySelector(b.dataset.scroll);\n    if (t) t.scrollIntoView({ behavior: \"smooth\", block: \"start\" });\n  });\n});\ndocument.querySelectorAll('a[href^=\"#\"]').forEach(a => {\n  a.addEventListener(\"click\", (e) => {\n    const id = a.getAttribute(\"href\");\n    const t = document.querySelector(id);\n    if (t) { e.preventDefault(); t.scrollIntoView({ behavior: \"smooth\", block: \"start\" }); }\n  });\n});\n\n/* =========== CURSOR =========== */\nconst cm = document.querySelector(\".cursor-main\");\nconst ct = document.querySelector(\".cursor-trail\");\nlet mx = innerWidth / 2, my = innerHeight / 2, tx = mx, ty = my;\nwindow.addEventListener(\"mousemove\", (e) => {\n  mx = e.clientX; my = e.clientY;\n  cm.style.left = mx + \"px\"; cm.style.top = my + \"px\";\n  // occasional sparkle\n  if (Math.random() < 0.06) makeSpark(mx, my);\n});\nfunction loop() {\n  tx += (mx - tx) * 0.18;\n  ty += (my - ty) * 0.18;\n  ct.style.left = tx + \"px\"; ct.style.top = ty + \"px\";\n  requestAnimationFrame(loop);\n}\nloop();\n\nconst sparkColors = [];\nfunction refreshSparkColors() {\n  const cs = getComputedStyle(document.body);\n  sparkColors.length = 0;\n  sparkColors.push(cs.getPropertyValue(\"--accent\").trim());\n  sparkColors.push(cs.getPropertyValue(\"--accent-2\").trim());\n  sparkColors.push(cs.getPropertyValue(\"--plum\").trim());\n}\nrefreshSparkColors();\n\nfunction makeSpark(x, y) {\n  const el = document.createElement(\"div\");\n  el.className = \"spark\";\n  el.style.left = x + (Math.random() * 30 - 15) + \"px\";\n  el.style.top = y + (Math.random() * 30 - 15) + \"px\";\n  const c = sparkColors[Math.floor(Math.random() * sparkColors.length)] || \"#ff8fb8\";\n  el.innerHTML = `<svg viewBox=\"0 0 24 24\" fill=\"${c}\" width=\"100%\" height=\"100%\"><path d=\"M12 2l1.5 6L20 10l-6 1.5L12 18l-2-6.5L4 10l6-2z\"/><\u002Fsvg>`;\n  document.body.appendChild(el);\n  setTimeout(() => el.remove(), 700);\n}\n\n// hide cursor on touch\nif (matchMedia(\"(pointer: coarse)\").matches) {\n  document.body.style.cursor = \"auto\";\n  cm.style.display = \"none\"; ct.style.display = \"none\";\n}\n\n/* =========== TWEAKS =========== */\nconst body = document.body;\nconst panel = document.getElementById(\"tweaks\");\n\nfunction applyTweaks(t) {\n  body.dataset.palette = t.palette;\n  body.dataset.cardstyle = t.cardStyle;\n  document.querySelectorAll(\".swatch\").forEach(s => s.classList.toggle(\"active\", s.dataset.pal === t.palette));\n  document.querySelectorAll(\"#cs button\").forEach(s => s.classList.toggle(\"active\", s.dataset.cs === t.cardStyle));\n  refreshSparkColors();\n}\napplyTweaks(window.__TWEAKS);\n\ndocument.querySelectorAll(\".swatch\").forEach(s => {\n  s.addEventListener(\"click\", () => {\n    window.__TWEAKS.palette = s.dataset.pal;\n    applyTweaks(window.__TWEAKS);\n    persist();\n  });\n});\ndocument.querySelectorAll(\"#cs button\").forEach(b => {\n  b.addEventListener(\"click\", () => {\n    window.__TWEAKS.cardStyle = b.dataset.cs;\n    applyTweaks(window.__TWEAKS);\n    persist();\n  });\n});\n\nfunction persist() {\n  try {\n    window.parent.postMessage({\n      type: \"__edit_mode_set_keys\",\n      edits: {\n        palette: window.__TWEAKS.palette,\n        cardStyle: window.__TWEAKS.cardStyle,\n        gcalApiKey: window.__TWEAKS.gcalApiKey || \"\",\n        gcalCalendarId: window.__TWEAKS.gcalCalendarId || \"\",\n        discordServerId: window.__TWEAKS.discordServerId || \"\",\n        discordInviteUrl: window.__TWEAKS.discordInviteUrl || \"\"\n      }\n    }, \"*\");\n  } catch (e) {}\n}\n\n/* =========== GOOGLE CALENDAR EVENTS =========== */\nconst DEMO_EVENTS = [\n  { date: new Date(2026,3,20,18,0), end: new Date(2026,3,20,21,0), title: \"Strawberry Hour ✿\", desc: \"Pink everything. Strawberry parfaits, strawberry latte art, strawberry photo-ops. Wear something pink for a free sticker~\", featured: true },\n  { date: new Date(2026,3,23,16,0), end: new Date(2026,3,23,19,0), title: \"Butlers' Tea Party\", desc: \"Sebastian and the boys serve a proper high-tea, three tiers, five kinds of scones. Dress code: garden soir\\u00e9e.\" },\n  { date: new Date(2026,3,27,20,0), end: new Date(2026,3,27,23,0), title: \"Host Karaoke ✿\", desc: \"The Hosts sing. You cheer. We keep the champagne flowing. BYO glitter encouraged.\" },\n];\nconst MONTHS = [\"jan\",\"feb\",\"mar\",\"apr\",\"may\",\"jun\",\"jul\",\"aug\",\"sep\",\"oct\",\"nov\",\"dec\"];\nconst DAYS = [\"Sun\",\"Mon\",\"Tue\",\"Wed\",\"Thu\",\"Fri\",\"Sat\"];\nfunction fmtTime(d) {\n  let h = d.getHours(), m = d.getMinutes();\n  const ap = h >= 12 ? \"pm\" : \"am\";\n  h = h % 12 || 12;\n  return m ? `${h}:${String(m).padStart(2,\"0\")}${ap}` : `${h}${ap}`;\n}\nfunction renderEvents(events, live) {\n  const grid = document.getElementById(\"events-grid\");\n  const status = document.getElementById(\"events-status\");\n  grid.innerHTML = \"\";\n  if (!events.length) {\n    grid.innerHTML = `<div class=\"events-empty\">no upcoming events — check back soon ♡<\u002Fdiv>`;\n    status.className = \"events-status\";\n    status.textContent = live ? \"connected to calendar\" : \"\";\n    return;\n  }\n  events.slice(0,6).forEach((e, i) => {\n    const card = document.createElement(\"div\");\n    card.className = \"event-card\" + (i === 0 ? \" featured\" : \"\");\n    const day = e.date.getDate();\n    const mo = MONTHS[e.date.getMonth()];\n    const dow = DAYS[e.date.getDay()];\n    const timeStr = e.end\n      ? `${dow} · ${fmtTime(e.date)}–${fmtTime(e.end)}`\n      : `${dow} · ${fmtTime(e.date)}`;\n    card.innerHTML = `\n      <div class=\"event-date-strip\">\n        <div class=\"big\">${day}<span style=\"font-size:.5em; color:var(--plum-soft);\">.${mo}<\u002Fspan><\u002Fdiv>\n        <div class=\"meta\">${timeStr}<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"event-title\">${e.title}<\u002Fdiv>\n      <div class=\"event-desc\">${e.desc || \"\"}<\u002Fdiv>\n      <div class=\"event-footer\">\n        <span class=\"spots\">♡ seats open<\u002Fspan>\n        <span class=\"rsvp\">reserve →<\u002Fspan>\n      <\u002Fdiv>`;\n    grid.appendChild(card);\n  });\n  status.className = live ? \"events-status live\" : \"events-status\";\n  status.textContent = live ? \"live from google calendar\" : \"showing demo events · add calendar in Tweaks\";\n  renderMiniSchedule(events);\n}\nfunction resolveCalendarId(raw) {\n  if (!raw) return \"\";\n  // If it's a full Google Calendar URL, extract + base64-decode the cid param\n  try {\n    const match = raw.match(/[?&]cid=([^&]+)/);\n    if (match) {\n      // cid is base64 encoded; decode to get the actual calendar ID\n      return atob(decodeURIComponent(match[1]));\n    }\n  } catch (e) {}\n  // Otherwise assume it's already a plain calendar ID\n  return raw.trim();\n}\n\nfunction renderMiniSchedule(events) {\n  const el = document.getElementById(\"mini-schedule\");\n  if (!el) return;\n  const items = events.slice(0, 4);\n  if (!items.length) return;\n  el.innerHTML = items.map(e => {\n    const day = String(e.date.getDate()).padStart(2,\"0\");\n    const mo = MONTHS[e.date.getMonth()];\n    const timeStr = e.end ? `${fmtTime(e.date)}–${fmtTime(e.end)}` : fmtTime(e.date);\n    const shortTitle = e.title.length > 22 ? e.title.slice(0,20) + \"…\" : e.title;\n    return `<div class=\"sched-row\">\n      <div class=\"sr-date\"><span class=\"day\">${day}<\u002Fspan><span class=\"mo\">${mo}<\u002Fspan><\u002Fdiv>\n      <div class=\"sr-info\"><div class=\"title\">${shortTitle}<\u002Fdiv><div class=\"time\">${timeStr}<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join(\"\");\n}\n\nasync function loadEvents() {\n  const { gcalApiKey, gcalCalendarId } = window.__TWEAKS;\n  if (!gcalApiKey || !gcalCalendarId) { renderEvents(DEMO_EVENTS, false); renderMiniSchedule(DEMO_EVENTS); return; }\n  const calId = resolveCalendarId(gcalCalendarId);\n  try {\n    const now = new Date().toISOString();\n    const url = `https://www.googleapis.com/calendar/v3/calendars/${encodeURIComponent(calId)}/events?key=${encodeURIComponent(gcalApiKey)}&timeMin=${encodeURIComponent(now)}&singleEvents=true&orderBy=startTime&maxResults=10`;\n    const res = await fetch(url);\n    if (!res.ok) throw new Error(\"calendar \" + res.status);\n    const data = await res.json();\n    const events = (data.items || []).map(it => {\n      const start = it.start.dateTime || it.start.date;\n      const end = it.end && (it.end.dateTime || it.end.date);\n      return {\n        date: new Date(start),\n        end: end ? new Date(end) : null,\n        title: it.summary || \"Untitled\",\n        desc: it.description || \"\",\n      };\n    });\n    renderEvents(events, true);\n    renderMiniSchedule(events);\n  } catch (err) {\n    const status = document.getElementById(\"events-status\");\n    renderEvents(DEMO_EVENTS, false);\n    status.textContent = `couldn\\u2019t load calendar (${err.message}) \\u2014 showing demo events`;\n    console.warn(\"GCal error:\", err);\n  }\n}\n\n/* =========== DISCORD WIDGET =========== */\nfunction fmt(n) { return n.toLocaleString(); }\nasync function loadDiscord() {\n  const { discordServerId, discordInviteUrl } = window.__TWEAKS;\n  const status = document.getElementById(\"discord-status\");\n  const invite = document.getElementById(\"dc-invite\");\n  if (discordInviteUrl) { invite.href = discordInviteUrl; invite.target = \"_blank\"; }\n  else { invite.href = \"#\"; }\n  if (!discordServerId) {\n    document.getElementById(\"dc-members\").textContent = \"2,418\";\n    document.getElementById(\"dc-online\").textContent = \"86\";\n    status.className = \"discord-status\";\n    status.textContent = \"demo counts · add server id in Tweaks for live data\";\n    return;\n  }\n  try {\n    const res = await fetch(`https://discord.com/api/guilds/${encodeURIComponent(discordServerId)}/widget.json`);\n    if (!res.ok) throw new Error(\"discord \" + res.status);\n    const data = await res.json();\n    document.getElementById(\"dc-online\").textContent = fmt(data.presence_count || (data.members||[]).length);\n    document.getElementById(\"dc-members\").textContent = fmt(data.presence_count ? (data.presence_count + 0) : 0);\n    document.getElementById(\"dc-members-l\").textContent = \"online members\";\n    document.querySelector(\"#dc-members\").parentElement.querySelector(\".l\").textContent = \"server members\";\n    // widget only returns online members; show server name as channel\n    if (data.name) document.getElementById(\"dc-channel\").textContent = \"# \" + data.name.toLowerCase().replace(/\\s+/g, \"-\");\n    // replace chat mock with live online member list\n    const msgs = document.getElementById(\"dc-msgs\");\n    if (Array.isArray(data.members) && data.members.length) {\n      msgs.innerHTML = data.members.slice(0, 5).map(m => `\n        <div class=\"msg\"><div class=\"av\" style=\"background:linear-gradient(135deg,#ffd6e3,#c9b0f0);\"><\u002Fdiv>\n          <div><b>${(m.username||\"member\").replace(/<\u002Fg,\"&lt;\")}<\u002Fb><span>• ${m.status || \"online\"}<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>`).join(\"\");\n    }\n    if (data.instant_invite && !discordInviteUrl) { invite.href = data.instant_invite; invite.target = \"_blank\"; }\n    // server members count is not exposed by widget; show presence only\n    document.getElementById(\"dc-members\").textContent = fmt(data.presence_count || 0);\n    const lbl = document.querySelector(\"#dc-members\").parentElement.querySelector(\".l\");\n    if (lbl) lbl.textContent = \"online now\";\n    const onlineLbl = document.getElementById(\"dc-online\").parentElement.querySelector(\".l\");\n    if (onlineLbl) onlineLbl.textContent = \"voice/text\";\n    document.getElementById(\"dc-online\").textContent = fmt((data.members||[]).filter(m=>m.channel_id).length);\n    status.className = \"discord-status live\";\n    status.textContent = \"live from discord widget\";\n  } catch (err) {\n    document.getElementById(\"dc-members\").textContent = \"—\";\n    document.getElementById(\"dc-online\").textContent = \"—\";\n    status.className = \"discord-status\";\n    status.textContent = \"couldn\\u2019t reach server widget (make sure it\\u2019s enabled)\";\n  }\n}\n\n/* =========== TWEAKS INPUT WIRING =========== */\nfunction bindInput(id, key) {\n  const el = document.getElementById(id);\n  el.value = window.__TWEAKS[key] || \"\";\n  let t;\n  el.addEventListener(\"input\", () => {\n    clearTimeout(t);\n    t = setTimeout(() => {\n      window.__TWEAKS[key] = el.value.trim();\n      persist();\n      if (key.startsWith(\"gcal\")) loadEvents();\n      if (key.startsWith(\"discord\")) loadDiscord();\n    }, 400);\n  });\n}\nbindInput(\"tw-gcal-id\", \"gcalCalendarId\");\nbindInput(\"tw-gcal-key\", \"gcalApiKey\");\nbindInput(\"tw-dc-id\", \"discordServerId\");\nbindInput(\"tw-dc-invite\", \"discordInviteUrl\");\n\nfunction renderMiniSchedule(events) {\n  const el = document.getElementById(\"mini-schedule\");\n  if (!el) return;\n  const items = events.slice(0, 4);\n  if (!items.length) return;\n  el.innerHTML = items.map(e => {\n    const day = String(e.date.getDate()).padStart(2,\"0\");\n    const mo = MONTHS[e.date.getMonth()];\n    const timeStr = e.end ? `${fmtTime(e.date)}–${fmtTime(e.end)}` : fmtTime(e.date);\n    const shortTitle = e.title.length > 22 ? e.title.slice(0,20) + \"…\" : e.title;\n    return `<div class=\"sched-row\">\n      <div class=\"sr-date\"><span class=\"day\">${day}<\u002Fspan><span class=\"mo\">${mo}<\u002Fspan><\u002Fdiv>\n      <div class=\"sr-info\"><div class=\"title\">${shortTitle}<\u002Fdiv><div class=\"time\">${timeStr}<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>`;\n  }).join(\"\");\n}\n\nloadEvents();\nsetInterval(loadDiscord, 60000); // refresh presence every minute\n\n\ndocument.getElementById(\"tw-close\").addEventListener(\"click\", () => panel.classList.remove(\"open\"));\n\n// edit mode availability\nwindow.addEventListener(\"message\", (e) => {\n  const d = e.data || {};\n  if (d.type === \"__activate_edit_mode\") panel.classList.add(\"open\");\n  if (d.type === \"__deactivate_edit_mode\") panel.classList.remove(\"open\");\n});\nwindow.parent.postMessage({ type: \"__edit_mode_available\" }, \"*\");\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
